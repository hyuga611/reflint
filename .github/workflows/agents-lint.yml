name: agents-lint
on:
  push:
  pull_request:

jobs:
  agents-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # このリポジトリ自身の Action で、自分の AGENTS.md を検査（ドッグフーディング）
      - uses: ./

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
